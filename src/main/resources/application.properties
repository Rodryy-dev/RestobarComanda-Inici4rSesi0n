# Servidor
server.port=8080

# Base de datos PostgreSQL
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/restobar}
spring.datasource.username=${DB_USER:restobar}
spring.datasource.password=${DB_PASSWORD:restobar}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Bootstrap del administrador
bootstrap.admin.codigo=${ADMIN_CODIGO:admin}
bootstrap.admin.contrasena=${ADMIN_CONTRASENA:admin123}
bootstrap.admin.dni=${ADMIN_DNI:00000000}
bootstrap.admin.nombre=${ADMIN_NOMBRE:Admin}
bootstrap.admin.apellido=${ADMIN_APELLIDO:Principal}

# Logs
logging.level.root=INFO
logging.level.com.restobar=DEBUG
logging.level.org.springframework.security=INFO
